name: "Publish OpenAPI + Javadoc (reusable)"

on:
  workflow_call:
    inputs:
      release-tag:
        description: "Git ref to check out and generate docs from"
        required: true
        type: string

permissions:
  contents: write

jobs:
  compute-version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      minor_version: ${{ steps.vars.outputs.minor_version }}
    steps:
      - name: Checkout repo at ${{ inputs.release-tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Compute version from pom.xml
        id: vars
        run: |
          currentVersion=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          releaseVersion=${currentVersion%-SNAPSHOT}

          n=${releaseVersion//[!0-9]/ }
          a=(${n//\./ })

          minorVersion="${a[0]}.${a[1]}"
          echo "minor_version=${minorVersion}" >> $GITHUB_OUTPUT

  publish-javadoc:
    name: Generate and Publish Javadoc
    runs-on: ubuntu-latest
    needs: compute-version
    permissions:
      contents: write
    steps:
      - name: Checkout repo at ${{ inputs.release-tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Generate Javadoc
        run: |
          mvn -B -e package javadoc:javadoc javadoc:aggregate -Pdistro,distro-webjar,javadocs \
            -pl '!engine-rest/engine-rest-openapi' \
            -DskipTests=true -DskipITs=true -Dskip.frontend.build=true \
            -s ./settings.xml -Dmaven.resolver.transport=wagon -Dmaven.wagon.http.pool=false

      - name: Publish Javadoc to GitHub Pages (test)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/reports/apidocs
          destination_dir: javadocs/${{ needs.compute-version.outputs.minor_version }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: publish Javadoc for ${{ inputs.release-tag }}'

  publish-openapi-spec:
    name: Generate and Publish OpenAPI Spec
    runs-on: ubuntu-latest
    needs: compute-version
    permissions:
      contents: write
    steps:
      - name: Checkout repo at ${{ inputs.release-tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Generate OpenAPI Spec
        run: |
          cd engine-rest && \
          mvn -B -e package  -pl '!engine-rest,!assembly' \
           -s ../settings.xml -Dmaven.test.skip -Dmaven.resolver.transport=wagon -Dmaven.wagon.http.pool=false 

      - name: Publish OpenAPI Spec to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./engine-rest/docs/target/dependency
          destination_dir: openapi/${{ needs.compute-version.outputs.minor_version }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: publish OpenAPI spec for ${{ inputs.release-tag }}'